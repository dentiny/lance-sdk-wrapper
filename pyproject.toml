[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lance-sdk-wrapper"
version = "0.1.0"
description = "Opinionated, configurable defaults for the Lance Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pylance>=10,<11",
    "typing-extensions>=4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["lance_sdk_wrapper"]

[tool.ruff]
line-length = 88
target-version = "py310"
